name: Build & Deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  ALIYUN_REGISTRY: crpi-uy6vawv1c8j0xywb.cn-hangzhou.personal.cr.aliyuncs.com
  ALIYUN_NAMESPACE: yeshengg
  NODE_VERSION: '22.13'
  PNPM_VERSION: '9.15.5'
  JAVA_VERSION: '21'

jobs:
  # ==================== 前端构建 x4（并行） ====================
  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
  
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        include:
          - name: home
            project: Frontend-Home
            domain: imying.top
  
          - name: blog
            project: Frontend-Blog
            domain: blog.imying.top
  
          - name: cv
            project: Frontend-Cv
            domain: cv.imying.top
  
          - name: admin
            project: Frontend-Admin
            domain: admin.imying.top
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
  
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.project }}/pnpm-lock.yaml
  
      - name: Configure pnpm registry
        run: |
          pnpm config set registry https://registry.npmmirror.com
          pnpm --version
          node --version
  
      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
  
      - name: Build ${{ matrix.name }}
        working-directory: ${{ matrix.project }}
        run: |
          pnpm build
  
      - name: Verify dist
        run: |
          echo "=== ${{ matrix.name }} dist ==="
          ls -lah "${{ matrix.project }}/dist"
          test -f "${{ matrix.project }}/dist/index.html"
  
      - name: Package dist
        run: |
          tar -czf "$GITHUB_WORKSPACE/${{ matrix.name }}.tar.gz" \
            -C "${{ matrix.project }}/dist" .
  
      - name: Verify package
        run: |
          echo "=== Package ==="
          ls -lh "$GITHUB_WORKSPACE/${{ matrix.name }}.tar.gz"
  
          echo "=== Package contents ==="
          tar -tzf "$GITHUB_WORKSPACE/${{ matrix.name }}.tar.gz" | head -30
  
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.name }}
          path: ${{ github.workspace }}/${{ matrix.name }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  # ==================== 后端构建 + Docker 镜像 ====================
  build-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Maven阿里云镜像加速
        run: |
          mkdir -p ~/.m2
          echo '<?xml version="1.0"?><settings><mirrors><mirror><id>aliyun</id><mirrorOf>central</mirrorOf><url>https://maven.aliyun.com/repository/public</url></mirror></mirrors></settings>' > ~/.m2/settings.xml

      - name: Build with Maven
        run: cd Backend && mvn clean package -DskipTests -B

      - name: Get short SHA
        id: meta
        run: echo "short_sha=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/feitwnd-backend:latest
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/feitwnd-backend:${{ steps.meta.outputs.short_sha }}

  # ==================== 部署到服务器 ====================
  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 修正分支判断，main正式部署
    if: github.ref == 'refs/heads/main'
    steps:
      # 逐个下载，规避批量下载网络重试失败
      - name: Download frontend-home
        uses: actions/download-artifact@v4
        with:
          name: frontend-home
          path: artifacts/frontend-home
        env:
          ACTIONS_RUNNER_DOWNLOAD_TIMEOUT: 300

      - name: Download frontend-blog
        uses: actions/download-artifact@v4
        with:
          name: frontend-blog
          path: artifacts/frontend-blog
        env:
          ACTIONS_RUNNER_DOWNLOAD_TIMEOUT: 300

      - name: Download frontend-cv
        uses: actions/download-artifact@v4
        with:
          name: frontend-cv
          path: artifacts/frontend-cv
        env:
          ACTIONS_RUNNER_DOWNLOAD_TIMEOUT: 300

      - name: Download frontend-admin
        uses: actions/download-artifact@v4
        with:
          name: frontend-admin
          path: artifacts/frontend-admin
        env:
          ACTIONS_RUNNER_DOWNLOAD_TIMEOUT: 300

      - name: Show artifact structure
        run: find artifacts -type f | sort

      - name: Copy frontend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: |
            artifacts/frontend-home/home.tar.gz
            artifacts/frontend-blog/blog.tar.gz
            artifacts/frontend-cv/cv.tar.gz
            artifacts/frontend-admin/admin.tar.gz
          target: /tmp/deploy/
          strip_components: 1
          rm: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
      
            cd /opt/YeSheng/YeSheng-Site
      
            REGISTRY="crpi-uy6vawv1c8j0xywb.cn-hangzhou.personal.cr.aliyuncs.com"
            NAMESPACE="yeshengg"
      
            IMAGE="${REGISTRY}/${NAMESPACE}/feitwnd-backend:${{ needs.build-backend.outputs.image_tag }}"
      
            echo "======================================"
            echo "Deploying backend:"
            echo "${IMAGE}"
            echo "======================================"
      
            # ===== ACR Login =====
            echo "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | \
            docker login \
              --username "${{ secrets.ALIYUN_REGISTRY_USERNAME }}" \
              --password-stdin \
              "${REGISTRY}"
      
            # ===== Docker Network =====
            if ! docker network inspect yesheng-site_feitwnd-network >/dev/null 2>&1; then
              docker network create yesheng-site_feitwnd-network
            fi
      
            # ===== Backend =====
            echo ">>> Pulling backend image..."
            docker pull "${IMAGE}"
      
            echo ">>> Restarting backend..."
      
            docker stop feitwnd-backend 2>/dev/null || true
            docker rm feitwnd-backend 2>/dev/null || true
      
            docker run -d \
              --name feitwnd-backend \
              --restart always \
              --network yesheng-site_feitwnd-network \
              -e SPRING_PROFILES_ACTIVE=docker \
              -e TZ=Asia/Shanghai \
              -e MYSQL_HOST=feitwnd-mysql \
              -e MYSQL_PORT=3306 \
              -e MYSQL_DATABASE=YeSheng \
              -e MYSQL_USER=feitwnd \
              -e MYSQL_PASSWORD='${{ secrets.MYSQL_PASSWORD }}' \
              -e REDIS_HOST=feitwnd-redis \
              -e REDIS_PORT=6379 \
              -e REDIS_PASSWORD='${{ secrets.REDIS_PASSWORD }}' \
              -e JWT_SECRET_KEY='${{ secrets.JWT_SECRET_KEY }}' \
              -e ALIOSS_ENDPOINT='${{ secrets.ALIOSS_ENDPOINT }}' \
              -e ALIOSS_ACCESS_KEY_ID='${{ secrets.ALIOSS_ACCESS_KEY_ID }}' \
              -e ALIOSS_ACCESS_KEY_SECRET='${{ secrets.ALIOSS_ACCESS_KEY_SECRET }}' \
              -e ALIOSS_BUCKET_NAME='${{ secrets.ALIOSS_BUCKET_NAME }}' \
              -e MAIL_HOST='${{ secrets.MAIL_HOST }}' \
              -e MAIL_PORT='${{ secrets.MAIL_PORT }}' \
              -e MAIL_USERNAME='${{ secrets.MAIL_USERNAME }}' \
              -e MAIL_PASSWORD='${{ secrets.MAIL_PASSWORD }}' \
              -e JWT_TTL='${{ secrets.JWT_TTL }}' \
              -v /opt/YeSheng/YeSheng-Site/docker/app/logs:/app/logs \
              "${IMAGE}"
      
            # ===== Backend Health =====
            echo ">>> Checking backend container..."
            sleep 5
      
            if ! docker ps --format '{{.Names}}' | grep -q '^feitwnd-backend$'; then
              echo "Backend container failed to start!"
              docker logs feitwnd-backend --tail 100
              exit 1
            fi
      
            echo ">>> Backend started successfully"
      
            # ===== Frontend =====
            echo ">>> Updating frontend..."
      
            extract() {
              SRC="$1"
              DST="$2"
      
              if [ ! -f "${SRC}" ]; then
                echo "[ERROR] Artifact not found: ${SRC}"
                exit 1
              fi
      
              mkdir -p "${DST}"
              rm -rf "${DST:?}"/*
              tar xzf "${SRC}" -C "${DST}/"
      
              echo "[OK] $(basename "${DST}")"
            }
      
            extract \
              /tmp/deploy/home.tar.gz \
              /opt/YeSheng/YeSheng-Site/docker/html/imying.top/html
      
            extract \
              /tmp/deploy/blog.tar.gz \
              /opt/YeSheng/YeSheng-Site/docker/html/blog.imying.top/html
      
            extract \
              /tmp/deploy/cv.tar.gz \
              /opt/YeSheng/YeSheng-Site/docker/html/cv.imying.top/html
      
            extract \
              /tmp/deploy/admin.tar.gz \
              /opt/YeSheng/YeSheng-Site/docker/html/admin.imying.top/html
      
            # ===== Nginx =====
            echo ">>> Checking nginx configuration..."
            docker exec feitwnd-nginx nginx -t
      
            echo ">>> Reloading nginx..."
            docker exec feitwnd-nginx nginx -s reload
      
            # ===== Cleanup =====
            rm -rf /tmp/deploy/
      
            echo "======================================"
            echo "✅ Deploy completed successfully!"
            echo "======================================"
